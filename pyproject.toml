[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perfusion-asl-arterial-spin-labeling-mri-engine"
version = "0.1.0"
description = "Autonomous Arterial Spin Labeling (ASL) MRI Perfusion Engine: Buxton General Kinetic Model, Quantitative Cerebral Blood Flow (CBF), Arterial Transit Time (ATT) mapping, and synthetic digital phantom generator."
readme = "README.md"
authors = [{ name = "Ayush Kandwal", email = "ayufrom03@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
